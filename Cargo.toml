[package]
name = "aralez"
version = "0.95.5"
edition = "2024"
license = "Apache-2.0"
description = "Reverse proxy built on top of Cloudflare's Pingora"
exclude = ["configs/*"]
repository = "https://github.com/sadoyan/aralez"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
pingora = { version = "0.9.1", features = ["lb", "openssl"] } # openssl, rustls, boringssl
pingora-core = "0.9.1"
pingora-proxy = "0.9.1"
pingora-http = "0.9.1"
pingora-limits = "0.9.1"
pingora-cache = "0.9.1"
dashmap = "7.0.0-rc2"
async-trait = "0.1.92"
log = "0.4.35"
notify = "9.0.0-rc.8"
axum = { version = "0.8.9" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
noyalib = { version = "0.0.58", features = ["compat-serde-yaml"] }
rand = "0.10.3"
base64 = "0.23.1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem", "rust_crypto"] }
sha2 = { version = "0.11.1", default-features = false }
base16ct = { version = "1.0.0", features = ["alloc"] }
urlencoding = "2.1.3"
arc-swap = "1.9.4"
prometheus = "0.14.0"
x509-parser = "0.18.1"
rustls-pemfile = "2.2.0"
tower-http = { version = "0.7.1", features = ["fs"] }
privdrop = "0.5.7"
serde_json = "1.0.154"
subtle = "2.6.1"
moka = { version = "0.12.16", features = ["sync", "future"] }
ahash = "0.8.12"
instant-acme = "0.8.5"
rcgen = "0.14.10"
log4rs = { version = "1.4.0", features = ["rolling_file_appender", "compound_policy", "size_trigger", "fixed_window_roller", "gzip"] }
mimalloc = { version = "0.1.52", default-features = false }
signal-hook = "0.4.6"
sd-notify = "0.5.0"
libc = "0.2.186"
tokio-native-tls = "0.3.1"
hyper = "1.12.0"
hyper-util = "0.1.21"
http-body-util = "0.1.5"
bytes = { version = "1.12.1", features = ["serde"] }

rustls = { version = "0.23.41", default-features = false, features = ["ring"] }
kube = { version = "5.0.0", features = ["runtime", "client", "derive"] }
k8s-openapi = { version = "0.29.0", features = ["v1_33"] }
futures = "0.3.34"
lazy_static = "1.5.1"
anyhow = "1.0.104"
inventory = "0.3.25"
elasticsearch = "9.1.0-alpha.1"
humantime = "2.4.0"
reqwest = { version = "0.13.5", features = ["json"] }
hickory-resolver = { version = "0.26.3", features = ["tokio"] }
aws-sdk-route53 = "1.132.0"
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
tikv-client = "0.4.0"
xxhash-rust = "0.8.19"
cpu-time = "1.0"